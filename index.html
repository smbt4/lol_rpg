<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LoL RPG</title>
</head>

<link rel="stylesheet" href="style.css">
</link>

<body>

    <div class="game-container">
        <canvas id="gameCanvas"></canvas>

        <!-- Das neue HTML-UI-Layer mit Statusbalken -->
        <div id="ui-layer">

            <div id="joystick-base"
                style="display: none; position: absolute; width: 100px; height: 100px; background: rgba(0,0,0,0.4); border: 2px solid rgba(255,255,255,0.4); border-radius: 50%; transform: translate(-50%, -50%); z-index: 10; pointer-events: none;">
                <div id="joystick-knob"
                    style="position: absolute; width: 40px; height: 40px; background: rgba(255,255,255,0.7); border-radius: 50%; top: 50%; left: 50%; transform: translate(-50%, -50%); transition: transform 0.05s linear;">
                </div>
            </div>

            <button id="fullscreen-btn" title="Vollbildmodus" style="
            position: absolute;
            top: 16px;
            right: 16px;
            width: 44px;
            height: 44px;
            background: transparent;
            border: none;
            cursor: pointer;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            pointer-events: auto;
            outline: none;
        ">
                <!-- Minimalistisches SVG mit nur 2 Ecken / Spitzen (Standard: zeigen nach außen) -->
                <svg id="fullscreen-icon" viewBox="0 0 24 24" width="26" height="26" stroke="rgba(255, 255, 255, 0.85)"
                    stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"
                    style="filter: drop-shadow(0px 2px 2px rgba(0,0,0,0.6));">
                    <!-- Ecke Oben-Rechts -->
                    <polyline points="16 4 20 4 20 8"></polyline>
                    <!-- Ecke Unten-Links -->
                    <polyline points="8 20 4 20 4 16"></polyline>
                </svg>
            </button>


            <!-- HP Balken -->
            <div class="bar-container" id="hp-bar-container">
                <div id="hp-fill" class="bar-fill"></div>
                <div class="bar-text">HP: <span id="ui-hp">25/25</span></div>
            </div>

            <!-- EP Balken -->
            <div class="bar-container" id="ep-bar-container">
                <div id="ep-fill" class="bar-fill"></div>
                <div class="bar-text">EP: <span id="ui-ep">1/50</span></div>
            </div>
        </div>
    </div>


    <script type="module" src="src/main.js"></script>

</body>

</html>
